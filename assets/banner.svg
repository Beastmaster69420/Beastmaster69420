<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Niroj Maharjan — Software &amp; Systems Engineer | Full Stack, Web3 &amp; Robotics">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#050B1F"/>
      <stop offset="55%"  stop-color="#081231"/>
      <stop offset="100%" stop-color="#04091A"/>
    </linearGradient>

    <radialGradient id="glowL" cx="16%" cy="52%" r="46%">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="60%"  stop-color="#1E3A8A" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050B1F" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowV" cx="82%" cy="18%" r="52%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#050B1F" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#E2E8F0"/>
      <stop offset="70%"  stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="50%"  stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8B5CF6"/>
      <stop offset="45%"  stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#22D3EE" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>

    <pattern id="hex" width="17" height="15" patternUnits="userSpaceOnUse">
      <path d="M8.5 0 L17 4.3 L17 11.2 L8.5 15 L0 11.2 L0 4.3 Z"
            fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="0.7"/>
    </pattern>

    <filter id="blur18" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="blur7" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38BDF8" flood-opacity="0.5"/>
    </filter>

    <clipPath id="card"><rect width="1200" height="400" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">

    <rect width="1200" height="400" fill="url(#bg)"/>

    <!-- ── circuit traces ─────────────────────────────── -->
    <g stroke="#1E40AF" stroke-opacity="0.55" stroke-width="1.2" fill="none">
      <path id="t1" d="M0 46 H150 L182 78 H392 L420 50 H640"/>
      <path id="t2" d="M1200 74 H1010 L978 106 H812"/>
      <path id="t3" d="M0 354 H210 L246 318 H430"/>
      <path id="t4" d="M1200 340 H980 L944 376 H700"/>
      <path id="t5" d="M560 400 V352 L596 316 V250"/>
      <path id="t6" d="M1140 130 V232 L1108 264 V400"/>
    </g>
    <g fill="#22D3EE" opacity="0.6">
      <circle r="2.6"><animateMotion dur="7s"  repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="6s"  begin="1.4s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
      <circle r="2.4"><animateMotion dur="8s"  begin="2.6s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>
      <circle r="2.2"><animateMotion dur="6.8s" begin="0.8s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion></circle>
      <circle r="2"  ><animateMotion dur="5.6s" begin="3.2s" repeatCount="indefinite"><mpath href="#t6"/></animateMotion></circle>
    </g>
    <g fill="#1E40AF" opacity="0.75">
      <circle cx="150" cy="46" r="3"/><circle cx="392" cy="78" r="3"/>
      <circle cx="1010" cy="74" r="3"/><circle cx="210" cy="354" r="3"/>
      <circle cx="980" cy="340" r="3"/><circle cx="1140" cy="130" r="3"/>
    </g>

    <rect width="1200" height="400" fill="url(#glowL)"/>
    <rect width="1200" height="400" fill="url(#glowV)"/>

    <!-- ── HUD rings ──────────────────────────────────── -->
    <g transform="translate(170,200)" fill="none">
      <circle r="150" stroke="#1D4ED8" stroke-opacity="0.34" stroke-width="1.4" stroke-dasharray="64 26 8 26">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" stroke="#22D3EE" stroke-opacity="0.26" stroke-width="1" stroke-dasharray="3 12">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle r="165" stroke="#8B5CF6" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="112 320">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- ── base plate ─────────────────────────────────── -->
    <ellipse cx="170" cy="335" rx="115" ry="18" fill="none" stroke="#1D4ED8" stroke-opacity="0.42" stroke-width="1.2"/>
    <ellipse cx="170" cy="335" rx="75" ry="11" fill="none" stroke="#22D3EE" stroke-opacity="0.26" stroke-width="1"/>
    <ellipse cx="170" cy="335" rx="50" ry="18" fill="#22D3EE" opacity="0.20" filter="url(#blur18)">
      <animate attributeName="opacity" values="0.12;0.28;0.12" dur="4s" repeatCount="indefinite"/>
    </ellipse>

    <!-- ── Center Graphic: Microchip / Systems Node Icon ────── -->
    <g transform="translate(170, 195)">
      <!-- Hexagon Outer -->
      <polygon points="0,-75 65,-37.5 65,37.5 0,75 -65,37.5 -65,-37.5" fill="#0B1B44" stroke="url(#rim)" stroke-width="3.5"/>
      <polygon points="0,-65 56,-32.5 56,32.5 0,65 -56,32.5 -56,-32.5" fill="url(#hex)" opacity="0.6"/>

      <!-- Code & Circuit Graphic Inside -->
      <g fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <!-- Code Brackets < / > -->
        <path d="M-22,-14 L-36,0 L-22,14" />
        <path d="M22,-14 L36,0 L22,14" />
        <line x1="8" y1="-18" x2="-8" y2="18" stroke="#818CF8" stroke-width="3"/>
      </g>

      <!-- Corner Node Lights -->
      <circle cx="0" cy="-75" r="3.5" fill="#38BDF8"/>
      <circle cx="65" cy="-37.5" r="3.5" fill="#38BDF8"/>
      <circle cx="65" cy="37.5" r="3.5" fill="#38BDF8"/>
      <circle cx="0" cy="75" r="3.5" fill="#38BDF8"/>
      <circle cx="-65" cy="37.5" r="3.5" fill="#38BDF8"/>
      <circle cx="-65" cy="-37.5" r="3.5" fill="#38BDF8"/>
    </g>

    <!-- ── vertical divider ────────────────────────────── -->
    <line x1="335" y1="100" x2="335" y2="310" stroke="#8B5CF6" stroke-opacity="0.6" stroke-width="2.5"/>

    <!-- ── name block ─────────────────────────────────── -->
    <g transform="translate(365, 0)">

      <!-- MAIN NAME -->
      <text x="0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="46" font-weight="900" fill="url(#silver)" letter-spacing="2" filter="url(#glowText)">
        NIROJ MAHARJAN
      </text>

      <!-- PRIMARY TITLE -->
      <text x="0" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="20" font-weight="700" fill="url(#cyan)" letter-spacing="1">
        Software &amp; Systems Engineer
      </text>

      <!-- SPECIALIZATIONS -->
      <text x="0" y="238" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="15" font-weight="500" fill="#CBD5E1">
        Full-Stack Web (React / Next.js) &#160;•&#160; Node.js &amp; Strapi
      </text>

      <text x="0" y="265" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
            font-size="15" font-weight="500" fill="#CBD5E1">
        Smart Contracts (Solidity) &#160;•&#160; Embedded Systems &amp; Robotics
      </text>

      <!-- INSTITUTION -->
      <g transform="translate(0, 302)">
        <rect x="0" y="-16" width="460" height="26" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
        <text x="12" y="1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
              font-size="12.5" font-weight="600" fill="#94A3B8">
          Electronics, Communication &amp; Information Engineering (BEI)
        </text>
      </g>
    </g>

    <!-- ── right divider ──────────────────────────────── -->
    <g stroke="#38BDF8" stroke-opacity="0.75">
      <line x1="880" y1="86" x2="880" y2="320" stroke-width="1.6"/>
    </g>
    <circle cx="880" cy="86"  r="4" fill="#38BDF8"/>
    <circle cx="880" cy="320" r="4" fill="#38BDF8"/>

    <!-- ── four pillars ───────────────────────────────── -->
    <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#E4EEF9">

      <line x1="960" y1="145" x2="1165" y2="145" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1"/>
      <line x1="960" y1="205" x2="1165" y2="205" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1"/>
      <line x1="960" y1="265" x2="1165" y2="265" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1"/>

      <!-- 1 · Full-Stack Web -->
      <g opacity="1">
        <g transform="translate(915,96)" fill="none" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="30" height="22" rx="3"/><line x1="3" y1="11" x2="33" y2="11"/>
          <circle cx="7" cy="8" r="1" fill="#38BDF8"/><circle cx="11" cy="8" r="1" fill="#38BDF8"/><circle cx="15" cy="8" r="1" fill="#38BDF8"/>
        </g>
        <text x="965" y="118" font-weight="600">Full-Stack Web</text>
        <text x="965" y="136" font-size="12" fill="#94A3B8">React, Next.js, Node.js</text>
      </g>

      <!-- 2 · Smart Contracts -->
      <g opacity="1">
        <g transform="translate(915,157)" fill="none" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 3 L31 10 L31 26 L18 33 L5 26 L5 10 Z"/><path d="M18 3 L18 33"/><path d="M5 10 L31 26"/><path d="M31 10 L5 26"/>
        </g>
        <text x="965" y="178" font-weight="600">Smart Contracts</text>
        <text x="965" y="196" font-size="12" fill="#94A3B8">Solidity &amp; Web3</text>
      </g>

      <!-- 3 · Systems & Robotics -->
      <g opacity="1">
        <g transform="translate(915,218)" fill="none" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="6" width="24" height="24" rx="4"/><circle cx="18" cy="18" r="5"/>
          <line x1="18" y1="2" x2="18" y2="6"/><line x1="18" y1="30" x2="18" y2="34"/>
          <line x1="2" y1="18" x2="6" y2="18"/><line x1="30" y1="18" x2="34" y2="18"/>
        </g>
        <text x="965" y="238" font-weight="600">Systems &amp; Robotics</text>
        <text x="965" y="256" font-size="12" fill="#94A3B8">3-DoF Arm, Linux, C/C++</text>
      </g>

      <!-- 4 · AI & Machine Learning -->
      <g opacity="1">
        <g transform="translate(915,279)" fill="none" stroke="url(#iconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="10" r="4"/><circle cx="8" cy="26" r="4"/><circle cx="28" cy="26" r="4"/>
          <line x1="15" y1="13" x2="10" y2="23"/><line x1="21" y1="13" x2="26" y2="23"/><line x1="12" y1="26" x2="24" y2="26"/>
        </g>
        <text x="965" y="298" font-weight="600">AI &amp; ML Training</text>
        <text x="965" y="316" font-size="12" fill="#94A3B8">Python &amp; React Native</text>
      </g>

    </g>

    <!-- ── light sweep + outer frame ─────────────────── -->
    <rect x="-460" y="0" width="460" height="400" fill="url(#sweep)" opacity="0.4">
      <animate attributeName="x" from="-460" to="1200" dur="8.5s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#38BDF8" stroke-opacity="0.22" stroke-width="1"/>
  </g>
</svg>
